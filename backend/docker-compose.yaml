services:
  postgres:
    image: postgres:17
    container_name: movie-postgres
    environment:
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepassword
      POSTGRES_DB: moviedb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviedb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: